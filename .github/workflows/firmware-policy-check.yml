name: Firmware Wi-Fi and configuration policy checks
on:
  push:
    branches: [main, master]
    paths:
      - firmware/Pocket/**
      - tools/test_upload_frames.py
      - tools/test_sound_feedback.py
      - tools/test_knob_gatt.py
      - tools/test_knob_hid.py
      - tools/test_wifi_profiles.py
      - tools/test_config_priority.py
      - tools/test_bluetooth_form.cjs
      - tools/test_config_form.cjs
      - tools/test_usb_disconnect.cjs
      - tools/test_usb_config.py
      - tools/usb_config.py
      - web/**
      - .github/workflows/firmware-policy-check.yml
  pull_request:
    paths:
      - firmware/Pocket/**
      - tools/test_upload_frames.py
      - tools/test_sound_feedback.py
      - tools/test_knob_gatt.py
      - tools/test_knob_hid.py
      - tools/test_wifi_profiles.py
      - tools/test_config_priority.py
      - tools/test_bluetooth_form.cjs
      - tools/test_config_form.cjs
      - tools/test_usb_disconnect.cjs
      - tools/test_usb_config.py
      - tools/usb_config.py
      - web/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyserial==3.5
      - run: |
          python -m unittest discover -s tools -p test_upload_frames.py -v
          python -m unittest discover -s tools -p test_sound_feedback.py -v
          python -m unittest discover -s tools -p test_knob_gatt.py -v
          python -m unittest discover -s tools -p test_knob_hid.py -v
          python -m unittest discover -s tools -p test_wifi_profiles.py -v
          python -m unittest discover -s tools -p test_config_priority.py -v
          python -m unittest discover -s tools -p test_usb_config.py -v
      - name: Check configuration JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          for name, output in [('firmware/Pocket/config_portal.h', '/tmp/device-page.js'), ('web/index.html', '/tmp/usb-page.js')]:
              source = Path(name).read_text(encoding='utf-8')
              Path(output).write_text(source.split('<script>', 1)[1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/device-page.js
          node --check /tmp/usb-page.js
          node --check web/serial.js
          node tools/test_usb_disconnect.cjs
          node tools/test_config_form.cjs
          node tools/test_bluetooth_form.cjs
