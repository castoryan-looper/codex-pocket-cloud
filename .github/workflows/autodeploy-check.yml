name: Automatic deployment checks
on:
  push:
    branches: [master, main]
    paths:
      - deploy/autodeploy.py
      - tools/test_autodeploy.py
      - .github/workflows/autodeploy-check.yml
  pull_request:
    paths:
      - deploy/autodeploy.py
      - tools/test_autodeploy.py
      - .github/workflows/autodeploy-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_autodeploy.py -v
