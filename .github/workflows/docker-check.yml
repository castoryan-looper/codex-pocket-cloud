name: Docker build and smoke checks
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - docker/**
      - bridge/**
      - deploy/docker.sh
      - .github/workflows/docker-check.yml
      - .github/fixtures/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and shell scripts
        env:
          PUBLIC_HOST: 43.160.215.253
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/pocket-compose.json
          python3 -c 'import json; c=json.load(open("/tmp/pocket-compose.json")); assert all(len(s["tmpfs"]) == 1 and s["tmpfs"][0].startswith("/tmp:") for s in c["services"].values())'
          bash -n deploy/docker.sh
          sh -n docker/gateway-entrypoint.sh
          sh -n docker/caddy-entrypoint.sh
      - name: Build gateway
        run: docker build --target gateway -t pocket-gateway:check -t codex-pocket-gateway:latest .
      - name: Check actual Compose mounts and non-root temporary writes
        env:
          PUBLIC_HOST: 43.160.215.253
        run: |
          docker compose run --rm --no-deps --entrypoint gosu gateway pocket:pocket sh -c 'id && echo mount-ok > /tmp/pocket-mount-check && cat /tmp/pocket-mount-check'
      - name: Check real entrypoint and repeat initialization on existing volumes
        env:
          PUBLIC_HOST: 43.160.215.253
        run: |
          docker compose run --rm --no-deps gateway self-test
          docker compose run --rm --no-deps gateway self-test
      - name: Check non-root runtime dependencies
        run: |
          docker run --rm --entrypoint gosu pocket-gateway:check pocket:pocket sh -c 'id && node --version && npm --version && codex --version && python -c "import aiohttp, PIL, faster_whisper"'
      - name: Run tests inside Linux image
        run: |
          docker run --rm --entrypoint env pocket-gateway:check -u POCKET_STATE_DIR -u POCKET_WORKSPACE -u POCKET_EXTERNAL_SANDBOX python -m unittest discover -s /app/bridge -p 'test_*.py' -v
      - name: Build and validate ingress
        run: |
          docker build --target ingress -t pocket-ingress:check .
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --entrypoint caddy pocket-ingress:check version
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /data --tmpfs /config --tmpfs /tmp -e POCKET_PUBLIC_HOST=43.160.215.253 --entrypoint caddy pocket-ingress:check validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check real ingress entrypoint with runtime restrictions
        run: |
          docker run -d --name pocket-ingress-smoke --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /data --tmpfs /config --tmpfs /trust --tmpfs /tmp -e POCKET_PUBLIC_HOST=43.160.215.253 pocket-ingress:check
          trap 'docker logs pocket-ingress-smoke; docker rm -f pocket-route-upstream pocket-ingress-smoke' EXIT
          docker run -d --name pocket-route-upstream --network container:pocket-ingress-smoke --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --read-only -v "$PWD/.github/fixtures/route-upstream.py:/fixture.py:ro" --entrypoint python pocket-gateway:check -B /fixture.py
          status() {
            docker exec pocket-ingress-smoke curl --silent --show-error --noproxy '*' --cacert /trust/root.crt --resolve 43.160.215.253:8443:127.0.0.1 --output /dev/null --write-out '%{http_code}' "https://43.160.215.253:8443$1"
          }
          ready=false
          for attempt in $(seq 1 30); do
            code=$(status /healthz || true)
            if [ "$code" = 200 ]; then ready=true; break; fi
            sleep 1
          done
          [ "$ready" = true ]
          [ "$(status /device)" = 418 ]
          [ "$(status /not-a-route)" = 404 ]
          [ "$(status /api/connection)" = 404 ]
          [ "$(status /api/state)" = 404 ]
